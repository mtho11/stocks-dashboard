<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="320" fill="#0d1117"/>

  <!-- price pane -->
  <rect x="20" y="16" width="760" height="200" rx="8" fill="#0f1419" stroke="#1a202c"/>

  <!-- bollinger band (dashed) -->
  <path d="M40 140 C 150 120, 250 90, 340 95 S 520 60, 620 70 S 740 55, 760 60"
    fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
  <path d="M40 175 C 150 165, 250 150, 340 155 S 520 120, 620 130 S 740 115, 760 118"
    fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>

  <!-- 200-day MA -->
  <path d="M40 185 C 200 175, 350 150, 500 130 S 680 90, 760 80"
    fill="none" stroke="#ed8936" stroke-width="2"/>
  <!-- 50-day MA -->
  <path d="M40 160 C 200 150, 350 120, 500 110 S 680 75, 760 68"
    fill="none" stroke="#4299e1" stroke-width="2"/>

  <!-- candlesticks -->
  <g stroke-width="6" stroke-linecap="round">
    <line x1="60"  y1="150" x2="60"  y2="170" stroke="#48bb78"/>
    <line x1="90"  y1="140" x2="90"  y2="160" stroke="#e53e3e"/>
    <line x1="120" y1="130" x2="120" y2="155" stroke="#48bb78"/>
    <line x1="150" y1="125" x2="150" y2="145" stroke="#48bb78"/>
    <line x1="180" y1="115" x2="180" y2="140" stroke="#e53e3e"/>
    <line x1="210" y1="110" x2="210" y2="130" stroke="#48bb78"/>
    <line x1="240" y1="100" x2="240" y2="122" stroke="#48bb78"/>
    <line x1="270" y1="105" x2="270" y2="125" stroke="#e53e3e"/>
    <line x1="300" y1="95"  x2="300" y2="115" stroke="#48bb78"/>
    <line x1="330" y1="90"  x2="330" y2="112" stroke="#48bb78"/>
    <line x1="360" y1="98"  x2="360" y2="118" stroke="#e53e3e"/>
    <line x1="390" y1="88"  x2="390" y2="108" stroke="#48bb78"/>
    <line x1="420" y1="80"  x2="420" y2="102" stroke="#48bb78"/>
    <line x1="450" y1="85"  x2="450" y2="105" stroke="#e53e3e"/>
    <line x1="480" y1="75"  x2="480" y2="96"  stroke="#48bb78"/>
    <line x1="510" y1="68"  x2="510" y2="90"  stroke="#48bb78"/>
    <line x1="540" y1="72"  x2="540" y2="94"  stroke="#e53e3e"/>
    <line x1="570" y1="62"  x2="570" y2="84"  stroke="#48bb78"/>
    <line x1="600" y1="55"  x2="600" y2="78"  stroke="#48bb78"/>
    <line x1="630" y1="60"  x2="630" y2="82"  stroke="#e53e3e"/>
    <line x1="660" y1="50"  x2="660" y2="72"  stroke="#48bb78"/>
    <line x1="690" y1="45"  x2="690" y2="66"  stroke="#48bb78"/>
    <line x1="720" y1="52"  x2="720" y2="74"  stroke="#e53e3e"/>
  </g>

  <!-- earnings marker -->
  <g transform="translate(330,60)">
    <polygon points="0,0 -6,-10 6,-10" fill="#ecc94b"/>
    <text x="0" y="-14" fill="#ecc94b" font-size="10" font-weight="700" text-anchor="middle">E</text>
  </g>
  <g transform="translate(600,45)">
    <polygon points="0,0 -6,-10 6,-10" fill="#ecc94b"/>
    <text x="0" y="-14" fill="#ecc94b" font-size="10" font-weight="700" text-anchor="middle">E</text>
  </g>

  <text x="36" y="34" fill="#718096" font-size="11" font-weight="600">50-Day MA</text>
  <text x="130" y="34" fill="#718096" font-size="11" font-weight="600">200-Day MA</text>
  <text x="234" y="34" fill="#718096" font-size="11" font-weight="600">Bollinger (10d, 1.8σ)</text>

  <!-- RSI pane -->
  <rect x="20" y="228" width="760" height="76" rx="8" fill="#0f1419" stroke="#1a202c"/>
  <line x1="20" y1="252" x2="780" y2="252" stroke="#e53e3e" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="20" y1="284" x2="780" y2="284" stroke="#48bb78" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <path d="M40 270 C 100 250, 160 290, 220 260 S 340 240, 400 255 S 520 230, 580 245 S 700 250, 760 235"
    fill="none" stroke="#f6ad55" stroke-width="2"/>
  <text x="36" y="244" fill="#718096" font-size="11" font-weight="600">RSI(10)</text>
  <text x="740" y="248" fill="#e53e3e" font-size="9">70 overbought</text>
  <text x="748" y="280" fill="#48bb78" font-size="9">30 oversold</text>
</svg>
