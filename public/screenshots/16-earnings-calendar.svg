<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="160" fill="#0d1117"/>

  <g transform="translate(30,50)">
    <text x="0" y="22" fill="#e2e8f0" font-size="20" font-weight="800">AAPL</text>
    <text x="66" y="22" fill="#718096" font-size="14" font-weight="500">Apple</text>

    <rect x="150" y="4" width="8" height="8" rx="2" fill="rgba(160,174,192,0.15)"/>
    <text x="150" y="24" fill="#718096" font-size="11" font-weight="500">Big Tech</text>

    <text x="230" y="19" fill="#718096" font-size="12">Next earnings (est.):</text>
    <text x="390" y="19" fill="#e2e8f0" font-size="12" font-weight="700">Oct 15, 2026</text>

    <rect x="500" y="2" width="150" height="24" rx="6" fill="#161b22" stroke="#2d3748"/>
    <text x="575" y="18" fill="#718096" font-size="11" font-weight="600" text-anchor="middle">+ Add to calendar</text>
  </g>

  <!-- little calendar icon under the button -->
  <g transform="translate(560,95)">
    <rect x="0" y="0" width="30" height="26" rx="4" fill="#161b22" stroke="#2d3748"/>
    <rect x="0" y="0" width="30" height="8" rx="4" fill="#4299e1"/>
    <line x1="8" y1="-4" x2="8" y2="4" stroke="#4299e1" stroke-width="2"/>
    <line x1="22" y1="-4" x2="22" y2="4" stroke="#4299e1" stroke-width="2"/>
    <text x="15" y="20" fill="#718096" font-size="9" text-anchor="middle" font-weight="700">.ics</text>
  </g>

  <text x="400" y="145" fill="#4a5568" font-size="11" text-anchor="middle">Downloads a ready-to-import calendar event</text>
</svg>
