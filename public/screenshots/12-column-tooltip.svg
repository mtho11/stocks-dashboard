<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="200" fill="#0d1117"/>
  <!-- header row -->
  <rect x="0" y="0" width="800" height="40" fill="#161b22"/>
  <text x="40" y="25" fill="#718096" font-size="12" font-weight="700" letter-spacing="1">TICKER</text>
  <text x="180" y="25" fill="#718096" font-size="12" font-weight="700" letter-spacing="1">PRICE</text>
  <text x="320" y="25" fill="#90cdf4" font-size="12" font-weight="700" letter-spacing="1" text-decoration="underline">RS</text>
  <text x="460" y="25" fill="#718096" font-size="12" font-weight="700" letter-spacing="1">RSI(14)</text>
  <text x="620" y="25" fill="#718096" font-size="12" font-weight="700" letter-spacing="1">Δ HIGHS</text>

  <!-- a couple of faint rows -->
  <rect x="0" y="40" width="800" height="26" fill="#0f1419"/>
  <rect x="0" y="66" width="800" height="26" fill="#0d1117"/>
  <text x="40" y="58" fill="#e2e8f0" font-size="12">NVDA</text>
  <text x="180" y="58" fill="#e2e8f0" font-size="12">$187.32</text>
  <text x="320" y="58" fill="#48bb78" font-size="12" font-weight="700">99</text>
  <text x="460" y="58" fill="#e2e8f0" font-size="12">71</text>
  <text x="620" y="58" fill="#48bb78" font-size="12">-2.10%</text>

  <!-- tooltip bubble under RS header -->
  <g transform="translate(300,80)">
    <rect x="0" y="0" width="230" height="70" rx="8" fill="#0d1117" stroke="#1a202c" stroke-width="1.5"/>
    <text x="14" y="24" fill="#e2e8f0" font-size="12.5" font-weight="600">RS Rank</text>
    <text x="14" y="42" fill="#a0aec0" font-size="11.5">Relative Strength percentile vs.</text>
    <text x="14" y="58" fill="#a0aec0" font-size="11.5">the rest of this list. Higher = stronger.</text>
  </g>

  <!-- cursor hovering over RS header -->
  <g transform="translate(316,10)">
    <path d="M0 0 L0 16 L4 12.5 L7 19 L10.5 17.5 L7.5 11 L13 11 Z" fill="#e2e8f0" stroke="#0d1117" stroke-width="0.5"/>
  </g>

  <text x="400" y="180" fill="#4a5568" font-size="11" text-anchor="middle">Hover ~0.75s → tooltip appears</text>
</svg>
