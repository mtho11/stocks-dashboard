<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="800" height="160" fill="#0d1117"/>

  <g transform="translate(30,40)">
    <!-- 6 stat tiles -->
    <g font-weight="800" font-size="18">
      <!-- 1D -->
      <rect x="0" y="0" width="112" height="70" rx="10" fill="#0f1419" stroke="#1a202c"/>
      <text x="56" y="24" fill="#4a5568" font-size="10" text-anchor="middle" letter-spacing="1" font-weight="700">1D</text>
      <text x="56" y="50" fill="#38a169" text-anchor="middle">+1.16%</text>

      <!-- 1W -->
      <rect x="124" y="0" width="112" height="70" rx="10" fill="#0f1419" stroke="#1a202c"/>
      <text x="180" y="24" fill="#4a5568" font-size="10" text-anchor="middle" letter-spacing="1" font-weight="700">1W</text>
      <text x="180" y="50" fill="#e53e3e" text-anchor="middle">-0.12%</text>

      <!-- 1M -->
      <rect x="248" y="0" width="112" height="70" rx="10" fill="#0f1419" stroke="#1a202c"/>
      <text x="304" y="24" fill="#4a5568" font-size="10" text-anchor="middle" letter-spacing="1" font-weight="700">1M</text>
      <text x="304" y="50" fill="#38a169" text-anchor="middle">+12.32%</text>

      <!-- YTD -->
      <rect x="372" y="0" width="112" height="70" rx="10" fill="#0f1419" stroke="#1a202c"/>
      <text x="428" y="24" fill="#4a5568" font-size="10" text-anchor="middle" letter-spacing="1" font-weight="700">YTD</text>
      <text x="428" y="50" fill="#38a169" text-anchor="middle">+22.40%</text>

      <!-- 1Y -->
      <rect x="496" y="0" width="112" height="70" rx="10" fill="#0f1419" stroke="#1a202c"/>
      <text x="552" y="24" fill="#4a5568" font-size="10" text-anchor="middle" letter-spacing="1" font-weight="700">1Y</text>
      <text x="552" y="50" fill="#38a169" text-anchor="middle">+38.70%</text>

      <!-- 2Y -->
      <rect x="620" y="0" width="112" height="70" rx="10" fill="#0f1419" stroke="#1a202c"/>
      <text x="676" y="24" fill="#4a5568" font-size="10" text-anchor="middle" letter-spacing="1" font-weight="700">2Y</text>
      <text x="676" y="50" fill="#38a169" text-anchor="middle">+31.61%</text>
    </g>
  </g>

  <text x="400" y="145" fill="#4a5568" font-size="11" text-anchor="middle">Green = up, red = down, at a glance</text>
</svg>
